<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Tools Library</title>
  <meta name="description" content="A personal library of AI models, plugins, skills, references, inspiration, UI components and tools.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <main class="main">
      <header class="top-bar">
        <div class="brand">
          <span class="brand-mark"><span class="icon filled">auto_awesome</span></span>
          <span class="brand-name">AI Library</span>
        </div>

        <label class="search">
          <span class="icon">search</span>
          <input id="search" type="search" placeholder="Search tools, skills, tags…" autocomplete="off">
          <kbd>/</kbd>
        </label>

        <div class="top-actions">
          <button class="icon-btn state" id="paletteBtn" title="Theme color" aria-haspopup="menu">
            <span class="icon">palette</span>
          </button>
          <button class="icon-btn state" id="modeBtn" title="Light / dark mode">
            <span class="icon" id="modeIcon">brightness_auto</span>
          </button>
          <button class="icon-btn state" id="moreBtn" title="More" aria-haspopup="menu">
            <span class="icon">more_vert</span>
          </button>
        </div>
      </header>

      <!-- Category chips -->
      <div class="cat-chips" id="catChips" role="tablist" aria-label="Categories"></div>

      <section class="hero" id="hero">
        <div class="hero-text">
          <h1 id="pageTitle">All resources</h1>
          <p id="pageSubtitle">Your library of AI models, plugins, skills, references, inspiration, components and tools.</p>
        </div>
        <div class="hero-stats" id="heroStats"></div>
      </section>

      <div class="toolbar">
        <div class="tag-chips" id="tagChips"></div>
        <div class="segmented" role="group" aria-label="Sort">
          <button class="seg state" data-sort="newest"><span class="icon">check</span>Newest</button>
          <button class="seg state" data-sort="az"><span class="icon">check</span>A–Z</button>
        </div>
      </div>

      <p class="result-count" id="resultCount" aria-live="polite"></p>
      <div id="sections"></div>
      <div class="empty" id="empty" hidden>
        <span class="icon">search_off</span>
        <h2>Nothing here yet</h2>
        <p>Try another search, clear the tag filters, or add a new resource.</p>
        <button class="btn tonal state" data-action="add"><span class="icon">add</span>Add resource</button>
      </div>
    </main>
  </div>

  <!-- FAB -->
  <button class="fab state" data-action="add" aria-label="Add resource">
    <span class="icon">add</span><span class="fab-label">Add resource</span>
  </button>

  <!-- Menus -->
  <div class="menu" id="paletteMenu" role="menu" hidden>
    <p class="menu-title">Theme color</p>
    <div class="swatches" id="swatches"></div>
    <label class="menu-item state custom-color">
      <span class="icon">colorize</span>Custom color
      <input type="color" id="customColor">
    </label>
  </div>

  <div class="menu" id="moreMenu" role="menu" hidden>
    <button class="menu-item state" data-menu="export" role="menuitem"><span class="icon">download</span>Export JSON</button>
    <button class="menu-item state" data-menu="import" role="menuitem"><span class="icon">upload</span>Import JSON</button>
    <hr>
    <button class="menu-item state danger" data-menu="reset" role="menuitem"><span class="icon">restart_alt</span>Remove my added items</button>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <!-- Add / edit dialog -->
  <dialog class="dialog" id="itemDialog">
    <form method="dialog" id="itemForm" novalidate>
      <span class="icon dialog-icon">bookmark_add</span>
      <h2 id="dialogTitle">Add resource</h2>
      <div class="fields">
        <label class="field">
          <span>Name</span>
          <input name="name" required maxlength="80" placeholder="e.g. Mobbin">
        </label>
        <label class="field">
          <span>URL</span>
          <input name="url" required placeholder="https://…" inputmode="url">
        </label>
        <label class="field">
          <span>Category</span>
          <select name="category" required></select>
          <span class="icon select-arrow">arrow_drop_down</span>
        </label>
        <label class="field">
          <span>Description</span>
          <textarea name="description" rows="3" maxlength="280" placeholder="What is it good for?"></textarea>
        </label>
        <label class="field">
          <span>Tags</span>
          <input name="tags" placeholder="comma, separated, tags">
        </label>
        <label class="field">
          <span>Found via (optional)</span>
          <input name="sourceUrl" placeholder="Link to the post or article">
        </label>
      </div>
      <p class="form-error" id="formError" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn text state" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn filled state" id="saveBtn">Save</button>
      </div>
    </form>
  </dialog>

  <div class="snackbar" id="snackbar" role="status" hidden>
    <span id="snackText"></span>
    <button class="snack-action" id="snackAction" hidden></button>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
